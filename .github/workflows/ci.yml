name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      CXX: clang++-18
      CC: clang-18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: sudo apt-get install -y cmake ninja-build clang-18 clang-tidy-18 ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-cache-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os}}-ccache-

      - name: Configure CMake
        run: cmake --preset debug

      - name: Build
        run: cmake --build build/debug

      - name: Run tests
        run: ctest --test-dir build/debug --output-on-failure

  formatting:
    runs-on: ubuntu-24.04

    steps:
      - name: Install packages
        run: sudo apt-get install -y clang-format-18

      - name: Run clang-format
        run: find src include -type f \( -name "*.cpp" -o -name "*.h" \) | xargs clang-format-18 --dry-run --Werror

  static-analysis:
    runs-on: ubuntu-24.04
    env:
      CXX: clang++-18
      CC: clang-18

    steps:
      - name: Install packages
        run: sudo apt-get install -y cmake nina-build clang-18 clang-tidy-18

      - name: Configure CMake
        run: cmake --preset debug

      - name: Run clang-tidy
        run: run-clang-tidy-18 -p "src/.*"